[package]
name = "oarlabel"
version = "0.1.0"
description = "Desktop OCR / layout annotation tool built with Tauri + oar-ocr"
authors = ["Wang Xin"]
license = "MIT"
repository = "https://github.com/GreatV/oarlabel"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oarlabel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Optional CUDA execution provider. Off by default so the app builds on
# machines without a CUDA toolkit; selecting the CUDA device at runtime
# returns a clear error unless the app is built with `--features cuda`.
cuda = ["oar-ocr/cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# OCR / image processing
oar-ocr = { version = "0.7.2", features = ["auto-download"] }
image = "0.25"

# PDF rendering (pure Rust) for "import PDF"
hayro = "0.5"

walkdir = "2"
